<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ADBU A'chik Nokdang Freshers' 2026</title>

<style>
* {margin:0;padding:0;box-sizing:border-box;}
body {font-family:'Segoe UI';background:black;color:white;overflow:hidden;}

/* COVER */
.cover {
    height:100vh;
    background:url('cover.jpg') no-repeat center/cover;
    filter:brightness(0.75);
}

/* NAVBAR */
.navbar {
    position:fixed;
    top:0;
    width:100%;
    padding:14px;
    background:rgba(0,0,0,0.5);
    display:flex;
    justify-content:center;
    gap:20px;
    z-index:100;
}
.navbar button {
    background:none;border:none;color:white;
    font-size:16px;font-weight:bold;cursor:pointer;
}
.navbar button:hover {color:gold;}

/* MAIN CARD */
.main-card {
    position:fixed;
    top:45%;left:50%;
    transform:translate(-50%,-50%);
    background:rgba(0,0,0,0.6);
    padding:25px;
    border-radius:15px;
    text-align:center;
}
.main-card h1 {
    color:gold;font-size:28px;
    text-shadow:0 0 10px gold;
}
.main-card p {font-size:20px;}

/* POPUP */
.popup {
    display:none;
    position:fixed;
    inset:0;
    background:rgba(0,0,0,0.6);
    backdrop-filter:blur(5px);
    z-index:1000;
    justify-content:center;
    align-items:center;
}
.popup-box {
    background:black;
    padding:25px;
    border-radius:15px;
    width:90%;
    max-width:800px;
}
.popup-box h2 {
    color:gold;text-align:center;
    margin-bottom:15px;
}
.popup-content {
    max-height:60vh;
    overflow:auto;
    background:rgba(255,255,255,0.05);
    padding:20px;
    border-radius:10px;
    line-height:1.8;
}

/* CLOSE */
.close-btn {
    position:absolute;
    top:10px;right:15px;
    background:red;color:white;
    border:none;font-size:25px;
    padding:5px 12px;
}

/* FOOD STACK */
.food-stack {
    display:flex;
    flex-direction:column;
    gap:15px;
}
.food-card {
    display:flex;
    align-items:center;
    gap:15px;
    background:#1a1a1a;
    padding:10px;
    border-radius:10px;
}
.food-card img {
    width:140px;height:100px;
    object-fit:cover;
    border-radius:10px;
}
.food-card p {
    color:gold;
    font-size:18px;
}

/* MAP */
iframe {
    width:100%;
    height:250px;
    border:none;
    border-radius:10px;
}
</style>
</head>

<body>

<div class="cover"></div>

<!-- NAVBAR -->
<div class="navbar">
<button onclick="openPopup('okamani')">Okamani Chitti</button>
<button onclick="openPopup('food')">Food</button>
<button onclick="openPopup('program')">Program</button>
<button onclick="openPopup('location')">Location</button>
</div>

<!-- MAIN CARD -->
<div class="main-card">
<h1>ADBU A'chik Nokdang Freshers' 2026</h1>
<p id="countdown"></p>
</div>

<!-- OKAMANI -->
<div id="okamani" class="popup">
<div class="popup-box">
<button class="close-btn" onclick="closePopup('okamani')">×</button>
<h2>Okamani Chitti</h2>

<div class="popup-content">
<p>
Ka'sara Freshers, mande ra'bean baksa, chingni nambegipa salamko on'e na'simangna mol'molaniko onna
